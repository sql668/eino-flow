# EinoFlow 本地依赖编排（一套命令拉起全部中间件）。
#
# 参考并整合了本地 Milvus 编排：
#   /Users/shiqingliang/Documents/docker-app/milvus/docker-compose.yml
#
# 服务：MySQL / Redis / MinIO / etcd / Milvus / Attu
#   - MinIO 由业务对象存储与 Milvus 后端存储共用：业务用 bucket `einoflow`，Milvus 用 bucket `milvus`。
#   - Attu 使用 3000 端口，因此前端 dev 固定跑 3001（见 web/package.json）。
#
# ⚠️ 启动前请先停掉那套独立的 Milvus 栈，否则 19530 / 9091 / 3000 端口会冲突：
#   docker compose -f /Users/shiqingliang/Documents/docker-app/milvus/docker-compose.yml down
#
# 镜像 tag 均选用本机已有镜像，避免重复下载。

name: einoflow

services:
  mysql:
    image: mysql:8.0
    container_name: einoflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-einoflow_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-einoflow}
      MYSQL_USER: ${MYSQL_USER:-einoflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-einoflow}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: einoflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: einoflow-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-einoflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-einoflow123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # 镜像内没有 curl，但有 mc（且预置了 local 别名），用官方推荐的 mc ready。
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: einoflow-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -name=etcd-0
      - -data-dir=/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.8
    container_name: einoflow-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-einoflow}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-einoflow123}
      # 与业务对象存储的 bucket 分开，避免互相干扰。
      MINIO_BUCKET_NAME: milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

  attu:
    image: zilliz/attu:v2.5
    container_name: einoflow-milvus-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      - milvus

volumes:
  mysql-data:
  redis-data:
  minio-data:
  etcd-data:
  milvus-data:
