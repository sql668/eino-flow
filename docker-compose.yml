# EinoFlow 本地依赖编排（一套命令拉起全部中间件）。
#
# 参考并整合了社区常见的 Milvus 编排写法（镜像 tag 与端口沿用本项目约定）。
#
# 服务：PostgreSQL / Redis / MinIO / etcd / Milvus / Attu
#   - MinIO 由业务对象存储与 Milvus 后端存储共用：业务用 bucket `einoflow`，Milvus 用 bucket `milvus`。
#   - Attu 使用 3000 端口，因此前端 dev 固定跑 3001（见 web/package.json）。
#
# ⚠️ 若本机已有别的 Milvus 栈在跑，先停掉它，否则 19530 / 9091 / 3000 端口会冲突：
#   cd <那套编排所在目录> && docker compose down
#
# 镜像 tag 均选用本机已有镜像，避免重复下载。

name: einoflow

services:
  postgres:
    image: postgres:15-alpine
    container_name: einoflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-einoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-einoflow}
      POSTGRES_DB: ${POSTGRES_DB:-einoflow}
      # 容器与数据库两侧都固定 UTC，和应用连接参数保持一致
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-einoflow} -d ${POSTGRES_DB:-einoflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: einoflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: einoflow-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-einoflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-einoflow123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # 镜像内没有 curl，但有 mc（且预置了 local 别名），用官方推荐的 mc ready。
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: einoflow-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -name=etcd-0
      - -data-dir=/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.8
    container_name: einoflow-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-einoflow}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-einoflow123}
      # 与业务对象存储的 bucket 分开，避免互相干扰。
      MINIO_BUCKET_NAME: milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

  attu:
    image: zilliz/attu:v2.5
    container_name: einoflow-milvus-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      - milvus

  # ---------- 文档解析服务 ----------
  # 放在 rag profile 下：镜像需要现场构建（约 3-5GB，首次较慢），
  # 不想解析文档时没必要为它付出构建成本。
  #   make up-rag   → 启动含 MinerU 的完整栈
  # 解析接口：POST http://127.0.0.1:8000/v1/...（V1 API），健康检查 /v1/health
  mineru:
    build:
      context: ./deploy/mineru
    image: einoflow-mineru:4
    container_name: einoflow-mineru
    profiles: ["rag"]
    restart: unless-stopped
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_HOME: /data/mineru
    ports:
      - "8000:8000"
    volumes:
      - mineru-data:/data/mineru
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5
    # OCR 与版面分析是 CPU 密集型，限制内存避免拖垮整机（Milvus 还在同一台机器上）
    deploy:
      resources:
        limits:
          memory: 4g

  # 重排模型下载器（一次性任务，跑完即退出）。
  #
  # 为什么需要单独一步：TEI 内置的下载器要求响应带 ETag，
  # 而 hf-mirror 这类镜像站不返回该头，直接启动会报
  # "Could not download model artifacts: Header etag is missing" 并反复重启。
  # 因此先用 huggingface_hub 把模型拉到卷里（它能正确处理镜像站），
  # 再让 TEI 以**本地路径**加载模型——两边共用一个卷，改一次即可。
  tei-model:
    # 用 3.11-slim 而不是 3.12：本项目开发机与常见服务器上更可能已有该镜像，
    # 避免首次部署时卡在拉基础镜像上（模型下载本身才是主要耗时）。
    image: ${TEI_DOWNLOADER_IMAGE:-python:3.11-slim}
    container_name: einoflow-tei-model
    profiles: ["rerank"]
    environment:
      # 留空表示自动探测：先试 huggingface.co，不可达再用 hf-mirror。
      # 写成死值会让另一部分用户（国外 / 国内）多踩一次坑，所以交给运行时判断。
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      # 镜像站不代理 HuggingFace 新的 Xet 存储（会返回 401），关闭后走传统下载。
      HF_HUB_DISABLE_XET: "1"
      TEI_MODEL_ID: ${TEI_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      # 默认用 PyPI 官方源；国内服务器上可覆盖成本地镜像。
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        pip install --quiet --no-cache-dir huggingface_hub
        if [ -z "$${HF_ENDPOINT}" ]; then
          if curl -fsS -m 8 -o /dev/null https://huggingface.co/api/models 2>/dev/null; then
            export HF_ENDPOINT=https://huggingface.co
          else
            export HF_ENDPOINT=https://hf-mirror.com
          fi
        fi
        echo "HuggingFace 端点: $${HF_ENDPOINT}"
        python -c "
        import os
        from huggingface_hub import snapshot_download
        model_id = os.environ['TEI_MODEL_ID']
        target = '/data/models/' + model_id
        snapshot_download(model_id, local_dir=target)
        print('模型已就绪:', target)
        "
    volumes:
      # 与边车共用同一个宿主目录：下载完边车直接按本地路径加载，不需要再搬运。
      - ${TEI_MODEL_DIR:-./deploy/models}:/data/models

  # 重排边车（TEI = HuggingFace text-embeddings-inference）。
  #
  # 为什么需要独立服务：Ollama 没有 /rerank 端点，其重排模型调用即崩溃（实测，见 D5），
  # 因此重排统一交给 TEI 承载；RAG 的两阶段检索里「重排」这一阶段就落在它身上。
  #
  # 两个部署相关的事实：
  #   1) CPU 版镜像只发布 linux/amd64，所以这里显式声明 platform——
  #      在 Apple Silicon 上会走模拟（慢，只够本地验证），在 CentOS x86_64 上是原生执行；
  #   2) huggingface.co 在国内不可达，模型经 hf-mirror 预下载到卷里（见上面的 tei-model），
  #      这里以本地路径加载，因此启动时不需要网络。
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: einoflow-tei
    profiles: ["rerank"]
    # 默认 linux/amd64：该镜像只发布 amd64。在 x86_64 服务器上这是原生的，
    # 在 Apple Silicon 上会走模拟（很慢，本机请用 deploy/rerank-local 的原生服务）。
    # 需要时可用 TEI_PLATFORM 覆盖（例如 arm64 镜像出现后）。
    platform: ${TEI_PLATFORM:-linux/amd64}
    depends_on:
      tei-model:
        # 等下载器成功退出再启动：模型没就绪的情况下 TEI 会直接崩溃重启。
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["--model-id", "/data/models/${TEI_MODEL_ID:-BAAI/bge-reranker-v2-m3}", "--port", "8080"]
    environment:
      # 已用本地路径加载模型，但保留镜像站配置：模型目录里的小文件按需回源时仍走镜像。
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # 限制推理线程：本机 / 2 核服务器上都要给 Milvus、MinerU 留出 CPU。
      RAYON_NUM_THREADS: ${TEI_THREADS:-2}
    ports:
      - "8080:8080"
    volumes:
      - ${TEI_MODEL_DIR:-./deploy/models}:/data/models
    healthcheck:
      # 首次启动要把 2GB 级模型读进内存，start_period 给得比较宽松。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/info || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 900s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  postgres-data:
  redis-data:
  minio-data:
  etcd-data:
  milvus-data:
  mineru-data:
